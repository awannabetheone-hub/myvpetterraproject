<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #ffddc3;
            font-family: pixelify, sans-serif;
        }

        main{
text-align: center;
    
        }

        #box-tutup {
            width: min(500px, 85vw);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #tutup-box{
            transform: scale(1.07);
        }

        #box:focus-visible {
            outline: 2px solid #b85c70;
            outline-offset : 8px;
        }
        </style>
    </head>
    <body>
        <h1>Myvpetterraproject</h1>
        <p></p>
    
    <main>
        
        <img
        id="box-tutup"
        src="asset/box/boxtutup.png"
        alt="come inside"
        tabindex="0"
        role="button"
        <h1>welcome to my virtual pet terra project</h1>
        >
    </main>

    <script>
        const toybox= document.querySelector("#box-tutup");

        toybox.addEventListener("click", () => {
            toybox.style.transform = "scale(1.07)";
            setTimeout(() =>{
                toybox.style.transform ="";
            
            }, 300);
        })
    </script>
    </body>
</html>
