<!DOCTYPE html>
<html lang="eng">
    <head>
         <link rel="icon" type="image/png" href="/asset/public/music-box.png">
        <script type="module" src="/src/App.js"></script>
                <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>myvpetterraproject</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
     
    
    </head>
   
    <body>
        <h1>Myvpetterraproject</h1>
        <p></p>
    
    <main>
        
        <img
        id="box-tutup"
        src="asset/box/boxtutup.png"
        alt="come inside"
        tabindex="0"
        role="button"
        >
        <h2>welcome to my virtual pet terra project,
            let's click the box 
        </h2>
        
    </main>

<div id="world">
        <div id="world-label">where the fun start</div>
        <div id="joystick"></div>
        <button id="jump-button" type="button" aria-label="jump"></button>
        
            <section id="pet-care">
                <p id="pet-message">lets play with me.</p>
                <label>Hunger <progress id="pet-hunger" max="100" value="60"></progress></label>
                <label>Happiness<progress id="pet-happiness" max="100" value="55"></progress></label>
                <label>Energy<progress id="pet-energy" max="100" value="90"></progress></label>
                <button type="button" data-care="feed">Feed</button>
                <button type="button" data-care="play">play</button>
                <button type="button" data-care="rest">Rest</button>
            </section>
    </div>

   
    </body>
</html>
